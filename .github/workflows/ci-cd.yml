name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest


  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend
        run: |
          docker build \
            -t inventory/backend:${{ github.sha }} \
            ./backend

      - name: Build frontend
        run: |
          docker build \
            -t inventory/frontend:${{ github.sha }} \
            ./frontend

      - name: Build nginx
        run: |
          docker build \
            -t inventory/nginx:${{ github.sha }} \
            ./nginx

      - name: Build backup
        run: |
          docker build \
            -t inventory/backup:${{ github.sha }} \
            ./backup