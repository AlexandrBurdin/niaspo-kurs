<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления запасами</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Система управления запасами</h1>
    <p>Управление складами сети ресторанов</p>
</header>

<main>

    <!-- Выбор ресторана -->
    <section class="card">
        <h2>Точка ресторана</h2>

        <div class="form-group">
            <label for="restaurantSelect">
                Выберите ресторан
            </label>

            <select id="restaurantSelect">
                <option value="">
                    Загрузка ресторанов...
                </option>
            </select>
        </div>

        <div class="restaurant-info">
            <h3 id="restaurantName"></h3>
            <p id="restaurantAddress"></p>
        </div>
    </section>


    <!-- Добавление продукта -->
    <section class="card">
        <h2>Добавить продукт на склад</h2>

        <form id="productForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="productName">
                        Название продукта
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Например, Помидоры"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productQuantity">
                        Количество
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        placeholder="10"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productUnit">
                        Единица измерения
                    </label>

                    <input
                        type="text"
                        id="productUnit"
                        placeholder="кг, л, шт."
                        required
                    >
                </div>

            </div>

            <button type="submit">
                Добавить на склад
            </button>

        </form>

        <div id="message" class="message"></div>
    </section>


    <!-- Склад -->
    <section class="card">

        <div class="warehouse-header">

            <div>
                <h2>Склад</h2>

                <p id="warehouseInfo">
                    Выберите ресторан
                </p>
            </div>

            <div
                id="productCount"
                class="product-count"
            >
                0 позиций
            </div>

        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Продукт</th>
                        <th>Количество</th>
                        <th>Единица</th>
                        <th>Действия</th>
                    </tr>
                </thead>

                <tbody id="productsTableBody"></tbody>

            </table>

        </div>

    </section>

</main>

<footer>
    Система управления запасами © 2026
</footer>

<script src="app.js"></script>

</body>
</html>
